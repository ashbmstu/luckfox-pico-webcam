name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The daemon itself needs the vendor SDK, so it cannot be built here. What can
  # be checked without a board is that the two files which have to agree about
  # resolutions actually do - see tools/test/check-modes.py for why that matters.
  check-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check daemon frame table matches board USB descriptors
        run: python3 tools/test/check-modes.py

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck -S warning

  lint-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # -Path is [string], not [string[]] - passing both directories in one
          # call throws a ParameterBindingException, so scan them one at a time.
          $errors = @()
          foreach ($dir in 'tools', 'scripts') {
            $errors += Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Error
          }
          if ($errors) {
            $errors | Format-List
            exit 1
          }

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative links in Markdown resolve
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys
          files = subprocess.check_output(['git', 'ls-files', '*.md'], text=True).split()
          bad = []
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  body = fh.read()
              for m in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', body):
                  target = m.group(2).split('#')[0].strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  path = os.path.normpath(os.path.join(os.path.dirname(f), target))
                  if not os.path.exists(path):
                      bad.append('%s -> %s' % (f, target))
          if bad:
              print('Broken relative links:')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('All %d Markdown files have resolving relative links.' % len(files))
          EOF

      - name: Check Markdown heading anchors resolve
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys

          def slug(h):
              # GitHub lowercases, drops anything that is not alphanumeric,
              # space, hyphen or underscore (em-dashes, parentheses and
              # backticks all vanish), then turns spaces into hyphens. It does
              # not collapse runs of spaces, so "A - B" with an em-dash gives
              # "a--b" with two hyphens.
              s = re.sub(r'[^\w\s-]', '', h.strip().lower(), flags=re.UNICODE)
              return s.replace(' ', '-')

          files = subprocess.check_output(['git', 'ls-files', '*.md'], text=True).split()
          anchors = {}
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  body = fh.read()
              # Repeated headings do not collapse: GitHub suffixes the second
              # and later occurrences with -1, -2 and so on, in document order.
              # Building a set here instead would report every link to a
              # repeated heading as broken.
              seen, found = {}, set()
              for h in re.findall(r'^#{1,6}\s+(.*?)\s*$', body, re.M):
                  base = slug(h)
                  n = seen.get(base, 0)
                  seen[base] = n + 1
                  found.add(base if n == 0 else '%s-%d' % (base, n))
              anchors[os.path.normpath(f)] = found

          bad, checked = [], 0
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  body = fh.read()
              for m in re.finditer(r'\[([^\]]*)\]\(([^)]+)\)', body):
                  target = m.group(2).strip()
                  if target.startswith(('http://', 'https://', 'mailto:')) or '#' not in target:
                      continue
                  path, _, frag = target.partition('#')
                  if not frag:
                      continue
                  dest = os.path.normpath(os.path.join(os.path.dirname(f), path)) if path else os.path.normpath(f)
                  checked += 1
                  if dest not in anchors:
                      bad.append('%s -> %s (target file not tracked)' % (f, target))
                  elif frag not in anchors[dest]:
                      near = [a for a in anchors[dest] if a.startswith(frag[:12])]
                      hint = ('   closest: ' + ', '.join(near)) if near else ''
                      bad.append('%s -> %s%s' % (f, target, hint))
          if bad:
              print('Broken heading anchors:')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('All %d anchor links resolve.' % checked)
          EOF
